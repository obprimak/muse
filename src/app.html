<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/brand/hummingbird-logo-round.jpg" />

		<!-- Preconnect to Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Load fonts asynchronously (non-blocking) -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
			/>
		</noscript>

		<!-- Default meta tags -->
		<meta property="og:site_name" content="Muse by Noran Shine" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Muse by Noran Shine | Luxury Boudoir Photography" />
		<meta
			property="og:description"
			content="Luxury boudoir photography by Noran Shine Studio in Lithia, Florida. Celebrate your confidence and beauty."
		/>
		<meta property="og:url" content="https://muse.noranshine.com" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="Muse by Noran Shine | Luxury Boudoir Photography"
		/>
		<meta
			name="twitter:description"
			content="Luxury boudoir photography by Noran Shine Studio in Lithia, Florida. Celebrate your confidence and beauty."
		/>

		%sveltekit.head%

		<!-- Analytics (env-gated, deferred) -->
		<script>
			if (typeof window !== 'undefined' && window.__MUSE_ANALYTICS_ID) {
				(typeof requestIdleCallback !== 'undefined'
					? requestIdleCallback
					: function (cb) {
							setTimeout(cb, 2000);
						})(function () {
					// Analytics init placeholder — replace with actual provider
					console.debug('[muse] analytics ready');
				});
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
