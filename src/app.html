<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/brand/hummingbird-logo-round.jpg" />

		<!-- Preconnect to Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Load fonts asynchronously (non-blocking) -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
			/>
		</noscript>

		<!-- Core SEO Meta Tags -->
		<meta name="description" content="Luxury boudoir photography by Noran Shine Studio in Lithia, Florida. Celebrate confidence, beauty, and self-expression through intimate portraiture for women of all ages." />
		<meta name="keywords" content="boudoir photography, luxury portraits, Tampa Bay photographer, Lithia photographer, confidence photography, artistic portraiture" />
		<meta name="author" content="Noran Shine" />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
		<meta name="theme-color" content="#0c0f1a" />
		<meta name="color-scheme" content="dark light" />

		<!-- Open Graph Meta Tags (Social Media Sharing) -->
		<meta property="og:site_name" content="Muse by Noran Shine" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Muse by Noran Shine | Luxury Boudoir Photography Studio" />
		<meta property="og:description" content="Empowering luxury boudoir photography sessions in Lithia, FL. Celebrate confidence, beauty, and self-expression. Serving women of all ages and backgrounds." />
		<meta property="og:image" content="https://muse.noranshine.com/brand/hummingbird-logo-round.jpg" />
		<meta property="og:image:width" content="3734" />
		<meta property="og:image:height" content="2234" />
		<meta property="og:image:type" content="image/jpeg" />

		<!-- Twitter Card Meta Tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@noranshine" />
		<meta name="twitter:creator" content="@noranshine" />
		<meta name="twitter:title" content="Muse by Noran Shine | Luxury Boudoir Photography" />
		<meta name="twitter:description" content="Empowering boudoir photography in Lithia, FL. Celebrate confidence, beauty, and artistic self-expression." />
		<meta name="twitter:image" content="https://muse.noranshine.com/brand/hummingbird-logo-round.jpg" />
		<meta name="twitter:image:alt" content="Muse studio hummingbird logo - luxury boudoir photography" />

		<!-- Structured Data (Schema.org JSON-LD for Rich Snippets) -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "LocalBusiness",
			"name": "Muse by Noran Shine",
			"description": "Luxury boudoir and portrait photography studio",
			"url": "https://muse.noranshine.com",
			"address": {
				"@type": "PostalAddress",
				"addressLocality": "Lithia",
				"addressRegion": "FL",
				"addressCountry": "US"
			},
			"areaServed": {
				"@type": "City",
				"name": "Tampa Bay Area"
			},
			"sameAs": [
				"https://www.instagram.com/noranshine",
				"https://www.facebook.com/Noranshinestudio",
				"https://noranshine.com"
			],
			"image": "https://muse.noranshine.com/brand/hummingbird-logo-round.jpg",
			"priceRange": "$$$",
			"hasOfferCatalog": {
				"@type": "OfferCatalog",
				"name": "Photography Services",
				"itemListElement": [
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "Boudoir Photography",
							"description": "Professional boudoir photography sessions for women of all ages and backgrounds"
						}
					},
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "Portrait Photography",
							"description": "Artistic and glamour portrait sessions"
						}
					},
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "Model Call Program",
							"description": "Creative photo sessions for portfolio expansion"
						}
					}
				]
			}
		}
		</script>

		%sveltekit.head%

		<!-- Analytics (env-gated, deferred) -->
		<script>
			if (typeof window !== 'undefined' && window.__MUSE_ANALYTICS_ID) {
				(typeof requestIdleCallback !== 'undefined'
					? requestIdleCallback
					: function (cb) {
							setTimeout(cb, 2000);
						})(function () {
					// Analytics init placeholder — replace with actual provider
					console.debug('[muse] analytics ready');
				});
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
